name: Check public demos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - sales-meeting-prep
          - company-research-agent/ui
          - market-researcher/ui
          - vendor-supply-chain-risk
          - travel-hospitality-intelligence-agent/ui
          - tavily-chat
          - fsi-kit/ui
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run fmt:check --if-present
      - run: npm test --if-present
      - run: npm run build
